<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Screen 12</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container" dir="rtl">
    <h2>بيانات الرسالة العلمي</h2>
    <form class="form-horizontal" action="">
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <table id="table" class="table table-striped">
                    <tr>
                        <th>كلية</th>
                        <th>قسم</th>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="title"> عنوان الرسالة </label></td>
                        <td><input type="text" class="form-control" id="title" placeholder=" عنوان الرسالة"
                                   readonly="readonly" disabled="disabled" name="title"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="degree">الدرجة العلمية</label></td>
                        <td><input type="text" class="form-control" id="degree" placeholder=" الدرجة العلمية"
                                   readonly="readonly" disabled="disabled" name="degree"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="supervisor">مشرف</label></td>
                        <td><input type="text" class="form-control" id="supervisor" placeholder=" مشرف"
                                   readonly="readonly" disabled="disabled" name="supervisor"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="committee">لجنة</label></td>
                        <td><input type="text" class="form-control" id="committee" placeholder=" لجنة"
                                   readonly="readonly" disabled="disabled" name="committee"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="scientificdept">قسم علمي</label></td>
                        <td><input type="text" class="form-control" id="scientificdept" placeholder=" قسم علمي"
                                   readonly="readonly" disabled="disabled" name="scientificdept"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="evaluation">تقييم</label></td>
                        <td><input type="text" class="form-control" id="evaluation" placeholder=" تقييم"
                                   readonly="readonly" disabled="disabled" name="evaluation"></td>
                    </tr>
                    <tr>
                        <td><label class="control-label " for="datediscussion">تاريخ المناقشة</label></td>
                        <td><input type="text" class="form-control" id="datediscussion" placeholder=" تاريخ المناقشة"
                                   readonly="readonly" disabled="disabled" name="datediscussion"></td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="attachments"> يرجى رفع الرسالة العلمي</label>
            <div class="col-sm-10">
                <input type="file" class="form-control" id="attachments" placeholder="يرجى رفع القاموس  "
                       name="attachments">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2"> هل تم نشر المادة العلمية من قبل؟</label>

            <div class="col-sm-10">
                <label class="radio-inline"><input type="radio" name="optradio">حكومي</label>
                <label class="radio-inline"><input type="radio" name="optradio">تجاري / خاص
                </label>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-1 col-sm-3">
                <label class="control-label col-sm-2" for="publisher"> الناشر</label>
                <input type="text" class=" form-control" id="publisher" placeholder=" الناشر" name="publisher"
                       readonly="readonly" disabled="disabled">
            </div>
            <div class="col-sm-offset-1 col-sm-3">
                <label class="control-label" for="placeofpublish"> مكان النشر</label>
                <input type="text" class=" form-control" id="placeofpublish" placeholder=" مكان النشر"
                       name="placeofpublish" readonly="readonly" disabled="disabled">
            </div>
            <div class="col-sm-offset-1 col-sm-3">
                <label class="control-label col-sm-2" for="date"> تاريخ </label>
                <input type="text" class="form-control datepicker" id="date" placeholder="تاريخ" name="date">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="reasonsforreject"> اسباب الرفض</label>
            <div class="col-sm-10">
                <textarea class="form-control" id="reasonsforreject" placeholder="اسباب الرفض"
                          rows="5" name="reasonsforreject"></textarea>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default" id="btnAccept">قبول</button>
                <button type="submit" class="btn btn-default" id="btnReject">رفض</button>
            </div>
        </div>

    </form>
</div>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="js/bootstrap.min.js"></script>
<script src="js/bootstrap-datepicker.js"></script>
<script>
    $('.datepicker').datepicker();
</script>
</body>
</html>
