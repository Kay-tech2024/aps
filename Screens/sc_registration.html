<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Bootstrap 101 Template</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container" dir="rtl">
    <h2>التسجيل على البوابة - النظام النشر العلمي</h2>
    <form class="form-horizontal" action="">
        <div class="form-group">
            <label class="control-label col-sm-2" for="fullname">الاسم الكامل </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="fullname" placeholder="الاسم الكامل" name="fullname">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="mobile">رقم الجوال </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="mobile" placeholder="رقم الجوال" name="mobile">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="dob">تاربخ الميلاد </label>
            <div class="col-sm-10">
                <input type="text" class="form-control datepicker" id="dob" placeholder="تاريخ الميلاد" name="dob">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="university">جامعة التخرج            </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="university" placeholder="جامعة التخرج" name="university">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="major">التخصص </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="major" placeholder="التخصص" name="major">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="nationality">الجنسية </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="nationality" placeholder="الجنسية" name="nationality">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="country">البلد </label>
            <div class="col-sm-10">
                <select class="form-control" id="country" name="country">
                    <option selected>اختار...</option>
                    <option>المملكة العربية السعودية</option>
                    <option>الامارات  </option>
                    <option>بحرين  </option>
                    <option>عمن  </option>
                    <option>الخ  </option>

                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="address">العنوان </label>
            <div class="col-sm-10">
                <textarea rows="5" class="form-control" id="address" placeholder="العنوان" name="address"></textarea>
            </div>
        </div>


        <div class="form-group">
            <label class="control-label col-sm-2" for="email">البريد الإلكتروني</label>
            <div class="col-sm-10">
                <input type="email" class="form-control" id="email" placeholder="البربيد الإلكتروني" name="email">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="pwd">الرمز السري:</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="pwd" placeholder="الرمز السري" name="pwd">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="confirmpwd">تاكيد رمز السري:</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="confirmpwd" placeholder=" تاكيد رمز السري" name="confirmpwd">
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">ارسال</button>
            </div>
        </div>
    </form>
</div>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="js/bootstrap.min.js"></script>
<script src="js/bootstrap-datepicker.js"></script>

<script>
    $('.datepicker').datepicker();
</script>
</body>
</html>
