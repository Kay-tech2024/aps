<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Bootstrap 101 Template</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container" dir="rtl">
    <h2>بيانات المؤلف</h2>
    <form class="form-horizontal" action="">

        <div class="form-group">
            <label class="control-label col-sm-2" for="name">اسم المؤلف</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="name" placeholder="اسم المؤلف" name="name">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="employer">صاحب العمل
            </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="employer" placeholder="صاحب العمل" name="employer">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">نوع الحساب البنكي</label>
            <div class="col-sm-10">
                <label class="radio-inline"><input type="radio" name="optradio">محلي</label>
                <label class="radio-inline"><input type="radio" name="optradio"> دولي</label>

            </div>
        </div>

        <div style="background:lavender; padding:15px; margin:5px;" data-type="local">
            <h4>بيانات الحساب</h4>
            <div class="form-group">
                <label class="control-label col-sm-2" for="localbank">اسم البنك </label>
                <div class="col-sm-10">
                    <select class="form-control" id="localbank" name="bank">
                        <option selected>اختار...</option>
                        <option>بنك الراجحي</option>
                        <option>سامبا</option>
                        <option>الخ</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="localaccountname">اسم صاحب الحساب</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="localaccountname" placeholder="اسم صاحب الحساب"
                           name="accountname">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="localiban"> رقم الايبان</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="localiban" placeholder="رقم الايبان"
                           name="iban">
                </div>
            </div>
        </div>

        <div style="background:lavender; padding:15px; margin:5px;" data-type="international">
            <h4>بيانات الحساب</h4>
            <div class="form-group">
                <label class="control-label col-sm-2" for="intlbank">اسم البنك </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" placeholder="اسم البنك" id="intlbank" name="intlbank">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="intlaccountname">اسم صاحب الحساب</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="intlaccountname" placeholder="اسم صاحب الحساب"
                           name="intlaccountname">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="intliban"> رقم الايبان</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="intliban" placeholder="رقم الايبان"
                           name="intliban">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="country">البلد </label>
                <div class="col-sm-10">
                    <select class="form-control" id="country" name="country">
                        <option selected>اختار...</option>
                        <option>المملكة العربية السعودية</option>
                        <option>الامارات  </option>
                        <option>بحرين  </option>
                        <option>عمن  </option>
                        <option>الخ  </option>

                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="city">المدينة </label>
                <div class="col-sm-10">
                    <select class="form-control" id="city" name="city">
                        <option selected>اختار...</option>
                        <option>الرياض  </option>
                        <option>الخ  </option>

                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="swiftcode"> رقم السوفت </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="swiftcode" placeholder=" رقم السوفت   "
                           name="swiftcode">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="attachments"> يرجى رفع الدليل الاثبات</label>
            <div class="col-sm-10">
                <input type="file" class="form-control" id="attachments" placeholder=" يرجى رفع الدليل الاثبات"
                       name="attachments">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">؟هل المواد جرع من المنتج العلمي</label>
            <div class="col-sm-10">
                <label class="radio-inline"><input type="radio" name="optradio">نعم</label>
                <label class="radio-inline"><input type="radio" name="optradio"> لا</label>
            </div>
        </div>

        <div style="background:lavender; padding:15px; margin:5px;">
            <div class="form-group">
                <label class="control-label col-sm-2" for="noofparticipants"> عدد المشتركين</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="noofparticipants" placeholder="   عدد المشتركين  "
                           name="noofparticipants">
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">ارسال</button>
            </div>
        </div>
    </form>
</div>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="js/bootstrap.min.js"></script>
<script src="js/bootstrap-datepicker.js"></script>

<script>
    $('.datepicker').datepicker();
</script>
</body>
</html>
