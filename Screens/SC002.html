<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Bootstrap 101 Template</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container" dir="rtl">
    <h2>بيانات الرسالة</h2>
    <form class="form-horizontal" action="">

        <div class="form-group">
            <label class="control-label col-sm-2" for="faculty">اختار الكلية  </label>
            <div class="col-sm-10">
                <select class="form-control" id="faculty" name="faculty">
                    <option selected>اختار...</option>
                    <option>المعهد العالي للقضاء</option>
                    <option>المعهد العالي لدعوة والإحتساب</option>
                    <option>الخ</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="major">القصم العلمي </label>
            <div class="col-sm-10">
                <select class="form-control" id="major" name="major">
                    <option selected>اختار...</option>
                    <option>المعهد العالي للقضاء</option>
                    <option>المعهد العالي لدعوة والإحتساب</option>
                    <option>الخ</option>

                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="title">عنوان الرسالة </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="title" placeholder="عنوان الرسالة " name="title">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">درجة العلمي </label>
            <div class="col-sm-10">
                <label class="radio-inline"><input type="radio" name="optradio">مجستير</label>
                <label class="radio-inline"><input type="radio" name="optradio">دكتورا
                </label>

            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="supervisor">المشرف  </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="supervisor" placeholder=" المشرف" name="supervisor">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="members">أعضاء لجنة المناقشة  </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="members" placeholder="أعضاء لجنة المناقشة " name="members  ">
            </div>
        </div>


        <div class="form-group">
            <label class="control-label col-sm-2" for="department">القسم العلمي </label>
            <div class="col-sm-10">
                <select class="form-control" id="department" name="department">
                    <option selected>اختار...</option>
                    <option>المعهد العالي للقضاء</option>
                    <option>المعهد العالي لدعوة والإحتساب</option>
                    <option>الخ</option>

                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="gpa">التقدير</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="gpa" placeholder="التقدير" name="gpa">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="discussiondate">تاريخ المناقشة</label>
            <div class="col-sm-10">
                <input type="text" class="form-control datepicker" id="discussiondate" placeholder="تاريخ المناقشة" name="discussiondate">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="attachments"> يرجى رفع المادة العلمية</label>
            <div class="col-sm-10">
                <input type="file" class="form-control" id="attachments" placeholder="يرجى رفع المادة العلمية " name="attachments">
            </div>
        </div>

        <div style="background:lavender; padding:15px; margin:5px;">
            <div class="form-group">
                <label class="control-label col-sm-2">نوع النشر</label>
                <div class="col-sm-10">
                    <label class="radio-inline"><input type="radio" name="optradio">حكومي</label>
                    <label class="radio-inline"><input type="radio" name="optradio">تجاري / خاص
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="publisher">الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="publisher" placeholder="الناشر" name="publisher">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="publisherplace">عنوان الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="publisherplace" placeholder="عنوان الناشر" name="publisher">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="publishdate">تاريخ الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control datepicker" id="publishdate" placeholder="تاريخ الناشر" name="publishdate">
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">ارسال</button>
            </div>
        </div>
    </form>
</div>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="js/bootstrap.min.js"></script>
<script src="js/bootstrap-datepicker.js"></script>

<script>
    $('.datepicker').datepicker();
</script>
</body>
</html>
