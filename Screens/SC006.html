<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Bootstrap 101 Template</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap-rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body>
<div class="container" dir="rtl">
    <h2>بيانات الموسوعة</h2>
    <form class="form-horizontal" action="">

        <div class="form-group">
            <label class="control-label col-sm-2" for="encyclopediamajor">تخصص الموسوعة  </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="encyclopediamajor" placeholder="تخصص الموسوعة  " name="encyclopediamajor">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="language">اللغة الموسوعة </label>
            <div class="col-sm-10" id="language">
                <div class="form-group">
                    <div class="col-sm-3">
                        <label class=" control-label radio-inline"><input type="radio" value="">العربية</label>
                    </div>
                    <div class="col-sm-3">
                        <label class=" control-label radio-inline"><input type="radio" value=""> مترجم من اللغة</label>
                        <input type="text" class="form-control col-sm-3" id="translatedfrom" placeholder=" "
                               name="translatedfrom">
                    </div>
                </div>
            </div>
        </div>


        <div class="form-group">
            <label class="control-label col-sm-2" for="title">عنوان الموسوعة  </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="title" placeholder="عنوان الموسوعة  " name="title">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2 text-center" for="titleoriginal">عنوان الكتاب الأصلي (خاص بالموسوعة المترجمة)   </label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="titleoriginal" placeholder="عنوان الموسوعة " name="titleoriginal">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2" for="authormajor">تخصص المؤلف</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="authormajor" placeholder="تخصص المؤلف " name="authormajor">
            </div>
        </div>


        <div class="form-group">
            <label class="control-label col-sm-2 text-center" for="recommendationno"> رقم توصية مجلسي القسم والكلية/المعهد (خاص بالكتب منهجي)</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="recommendationno" placeholder=" رقم توصية  " name="recommendationno">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2 text-center" for="recommendationdate"> تاريخ توصية مجلسي القسم والكلية/المعهد (خاص بالكتب منهجي)</label>
            <div class="col-sm-10">
                <input type="text" class="form-control datepicker" id="recommendationdate" placeholder="تاريخ توصية " name="recommendationdate">
            </div>
        </div>


        <div class="form-group">
            <label class="control-label col-sm-2" for="attachments"> يرجى رفع الموسوعة</label>
            <div class="col-sm-10">
                <input type="file" class="form-control" id="attachments" placeholder="يرجى رفع الموسوعة  "
                       name="attachments">
            </div>
        </div>

        <div style="background:lavender; padding:15px; margin:5px;">
            <div class="form-group">
                <label class="control-label col-sm-2">نوع النشر</label>
                <div class="col-sm-10">
                    <label class="radio-inline"><input type="radio" name="optradio">حكومي</label>
                    <label class="radio-inline"><input type="radio" name="optradio">تجاري / خاص
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="publisher">الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="publisher" placeholder="الناشر" name="publisher">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-sm-2" for="publisherplace">عنوان الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="publisherplace" placeholder="عنوان الناشر"
                           name="publisher">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="publishdate">تاريخ الناشر</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control datepicker" id="publishdate" placeholder="تاريخ الناشر"
                           name="publishdate">
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">ارسال</button>
            </div>
        </div>
    </form>
</div>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="js/bootstrap.min.js"></script>
<script src="js/bootstrap-datepicker.js"></script>

<script>
    $('.datepicker').datepicker();
</script>
</body>
</html>
